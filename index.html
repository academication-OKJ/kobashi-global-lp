WHY KOBASHI
まず、KOBASHIを知ることから。
これまで日本・欧州・北米・中国・東南アジアで、海外営業、新規市場開拓、拠点立ち上げ、現地チーム構築、代理店・顧客との折衝に携わってきました。加えて、2023年頃からは仕事の傍ら自ら畑を耕し、農業の現場にも触れています。だからこそ、最初から「売る方法」を決めるのではなく、まずKOBASHIの技術・製品・現場・既存市場を理解するところから始めたいと考えています。

GLOBAL

STEP 01 — LEARN
まず、KOBASHIを知る。
この期間は「変える」ことより「理解する」ことを優先します。
理解する対象
	•	製品・技術・製造現場
	•	製品ごとの強みと用途
	•	既存海外市場・既存代理店
	•	顧客・競合・価格帯
	•	開発・品質・サービス体制
社内の理解
	•	営業
	•	開発
	•	製造
	•	システム
	•	海外事業に関わる意思決定プロセス
3 MONTHS+

理解した情報を、少しずつ戦略と施策へ。
最初から大規模な海外展開を目指すのではなく、「どの国で、どの製品を、誰に、どんな価値として、どの販売方法で届けるのか」を小さく仮説検証しながら組み立てます。

世界からKOBASHIへ、接点を増やす。
Webサイトをつくること自体が目的ではありません。目的は、潜在顧客・代理店・パートナーとの接点を増やし、問い合わせから商談、デモ、実証へ進めることです。

LOCALIZATION — 「翻訳」ではなく「市場化」
国ごとに、言語だけでなく「誰が、何に困り、何を判断材料にして購入するのか」まで変える。製品情報を現地の商習慣・農業条件・顧客課題に合わせて組み替えます。

市場ごとにLead → Meeting → Demo → Trial → Salesの母数を持ち、週次・月次でKPIを確認する。受注だけでなく、次の商談・次の実証・次の代理店候補を先行して積み上げます。

STEP 07 — AUTONOMIZE
各国が、自ら事業を動かせる状態へ。
最終的には、自分自身がすべての国を細かく管理することを目標にしません。各国が自律的に判断しながら、KOBASHIと連携して成長し続けられる事業体制をつくります。
