<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e6">
<meta name="description" content="KOBASHI GLOBAL BUSINESS DEVELOPMENT — 日本の技術を、世界の現場で使われる事業へ。">
<title>KOBASHI GLOBAL BUSINESS DEVELOPMENT | Takehiro Muraoka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f7f1e6;
  --surface:#fffdf8;
  --ink:#463a2f;
  --ink-strong:#30271f;
  --muted:#887a68;
  --green:#4f6f45;
  --green-2:#7f9a70;
  --earth:#b78658;
  --earth-soft:#ecd8bb;
  --line:rgba(70,58,47,.13);
  --dark:#302820;
  --dark-muted:#b8aa96;
  --max:1120px;
  --nav-h:72px;
  --radius:12px;
  --shadow:0 10px 30px rgba(61,48,36,.045);
}

*{box-sizing:border-box;margin:0;padding:0}
html{
  scroll-behavior:smooth;
  scroll-padding-top:calc(var(--nav-h) + env(safe-area-inset-top));
}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,"Noto Sans JP",sans-serif;
  line-height:1.8;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body::selection{background:var(--earth-soft)}
a{color:inherit}
img{max-width:100%;display:block}
.jp{font-family:"Noto Serif JP",serif}
.wrap{width:min(var(--max),calc(100% - 56px));margin-inline:auto}
section{padding:116px 0;border-bottom:1px solid var(--line)}
section[id]{scroll-margin-top:calc(var(--nav-h) + 18px)}

.skip{
  position:fixed;left:16px;top:12px;z-index:1000;
  transform:translateY(-150%);
  background:var(--dark);color:#fff;padding:9px 14px;border-radius:7px;
  text-decoration:none;font-size:.82rem;
}
.skip:focus{transform:none}

nav{
  position:fixed;inset:0 0 auto;z-index:100;
  min-height:var(--nav-h);
  padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
  padding-top:env(safe-area-inset-top);
  background:rgba(247,241,230,.9);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
nav .wrap{min-height:var(--nav-h);display:flex;align-items:center;gap:24px}
.brand{font-size:.86rem;font-weight:700;letter-spacing:.1em;white-space:nowrap}
.brand span{color:var(--muted);font-weight:400}
.navlinks{
  display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none;
}
.navlinks::-webkit-scrollbar{display:none}
.navlinks a{
  position:relative;padding:9px 10px;
  color:var(--muted);font-size:.72rem;letter-spacing:.06em;
  text-decoration:none;white-space:nowrap;transition:color .2s ease;
}
.navlinks a::after{
  content:"";position:absolute;left:10px;right:10px;bottom:2px;height:1px;
  background:var(--green);transform:scaleX(0);transform-origin:left;
  transition:transform .2s ease;
}
.navlinks a:hover,.navlinks a.active{color:var(--green)}
.navlinks a.active::after{transform:scaleX(1)}

.hero{
  min-height:calc(100svh - 12px);
  display:flex;align-items:center;
  padding:calc(var(--nav-h) + 34px + env(safe-area-inset-top)) 0 58px;
  position:relative;overflow:hidden;
  border-bottom:1px solid var(--line);
  background:
    radial-gradient(circle at 83% 18%,rgba(183,134,88,.17),transparent 30%),
    radial-gradient(circle at 7% 88%,rgba(113,128,91,.13),transparent 32%);
}
.hero::after{
  content:"";position:absolute;width:38vw;height:38vw;max-width:520px;max-height:520px;
  right:-14vw;bottom:-18vw;border:1px solid rgba(183,134,88,.16);border-radius:50%;
}
.eyebrow{
  margin-bottom:24px;color:var(--muted);
  font-size:.76rem;letter-spacing:.18em;font-weight:600;
}
.hero h1{
  max-width:780px;
  color:var(--ink-strong);
  font-size:clamp(2rem,5.5vw,4.15rem);
  line-height:1.48;font-weight:700;letter-spacing:.01em;
}
.hero h1 span{color:var(--earth)}
.hero .sub{
  margin-top:30px;color:var(--green);
  font-size:clamp(.68rem,1.6vw,.86rem);
  letter-spacing:.11em;font-weight:600;
}
.hero .msg{
  margin-top:8px;color:var(--muted);
  font-size:clamp(1rem,2vw,1.14rem);
}
.hero-meta{
  display:flex;flex-wrap:wrap;gap:10px;margin-top:38px
}
.hero-meta span{
  border:1px solid var(--line);background:rgba(255,253,248,.62);
  border-radius:999px;padding:6px 12px;color:var(--muted);font-size:.75rem;
}

.label{
  margin-bottom:15px;color:var(--green);
  font-size:.72rem;letter-spacing:.18em;font-weight:700;
}
h2.title{
  color:var(--ink-strong);
  font-family:"Noto Serif JP",serif;
  font-size:clamp(1.55rem,3.5vw,2.45rem);
  line-height:1.55;font-weight:700;
}
.section-sub,.body{
  color:var(--muted);font-size:1rem;max-width:690px;
}
.section-sub{margin-top:12px}
.body{margin-top:18px}
.lead{font-size:1.05rem}

.fade{
  opacity:0;transform:translateY(18px);
  transition:opacity .75s ease,transform .75s ease;
}
.fade.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
  .fade{opacity:1;transform:none}
}

.kw-list{
  display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:38px
}
.kw-list>div,.col-box,.principle{
  background:rgba(255,253,248,.7);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow)
}
.kw-list>div{padding:20px 18px}
.kw-word{
  display:block;margin-bottom:7px;color:var(--green);
  font-family:"Noto Serif JP",serif;font-size:1rem;font-weight:700;
}
.kw-desc{display:block;color:var(--muted);font-size:.84rem;line-height:1.65}

.stage-tag{
  display:inline-flex;padding:5px 13px;margin-bottom:19px;
  border:1px solid var(--green-2);border-radius:999px;
  color:var(--green);font-size:.72rem;letter-spacing:.1em;font-weight:600
}

.two-col{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:34px
}
.col-box{padding:25px}
.col-box h4{
  margin-bottom:13px;color:var(--green);
  font-size:.76rem;letter-spacing:.11em;font-weight:700
}
.col-box p{color:var(--muted)}
.col-box ul{list-style:none;color:var(--muted);font-size:.9rem}
.col-box li{padding:7px 0;border-bottom:1px dashed var(--line)}
.col-box li:last-child{border-bottom:0}

.stepflow,.flow{
  display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:18px
}
.stepflow span,.flow span{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--line);background:var(--surface);
  border-radius:999px;color:var(--ink);font-size:.82rem;padding:7px 12px;
}
.stepflow b{
  width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:50%;background:var(--green);color:#fff;font-size:.62rem
}
.stepflow i,.flow i{color:var(--earth);font-style:normal;font-size:.8rem}
.mini-label{
  margin-top:30px;color:var(--muted);font-size:.72rem;letter-spacing:.12em;font-weight:700
}

.digital-grid{
  display:grid;grid-template-columns:1.35fr .65fr;gap:22px;margin-top:34px
}
.lang-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.lang-row span{
  padding:6px 11px;border:1px solid var(--line);border-radius:999px;
  color:var(--muted);font-size:.77rem
}
.cta-note{
  margin-top:24px;padding:18px 20px;border-left:3px solid var(--earth);
  background:rgba(236,216,187,.22);color:var(--muted);font-size:.9rem
}
.local-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;margin-top:20px
}
.local-grid>div{
  display:grid;grid-template-columns:26px 1fr;column-gap:7px;
  padding:10px 11px;border:1px solid var(--line);
  border-radius:8px;background:rgba(247,241,230,.45)
}
.local-grid b{
  grid-row:span 2;color:var(--earth);font-size:.7rem
}
.local-grid span{
  color:var(--green);font-size:.69rem;letter-spacing:.07em;font-weight:700
}
.local-grid small{
  color:var(--muted);font-size:.72rem;line-height:1.5
}
.pipeline{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;margin-top:20px
}
.pipeline>div{
  display:grid;grid-template-columns:30px 1fr;
  padding:10px 11px;border:1px solid var(--line);border-radius:8px;
  background:rgba(247,241,230,.45)
}
.pipeline strong{grid-row:span 2;color:var(--earth);font-size:.7rem}
.pipeline span{color:var(--green);font-size:.69rem;letter-spacing:.06em;font-weight:700}
.pipeline small{color:var(--muted);font-size:.72rem;line-height:1.5}
.always-on{
  display:flex;align-items:flex-start;gap:16px;margin-top:20px;
  padding:20px 22px;border:1px solid rgba(79,111,69,.28);
  border-radius:var(--radius);
  background:linear-gradient(90deg,rgba(127,154,112,.13),rgba(255,253,248,.62));
}
.always-icon{
  flex:0 0 auto;color:var(--green);font-size:1.55rem;line-height:1.2;font-weight:600
}
.always-on strong{display:block;color:var(--green);font-size:.96rem}
.always-on p{margin-top:5px;color:var(--muted);font-size:.82rem;line-height:1.7}

.business-engine{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px
}
.business-engine>div{
  padding:13px 11px;border-top:2px solid var(--green);
  background:rgba(255,253,248,.65);border-radius:0 0 8px 8px
}
.business-engine b{display:block;color:var(--green);font-size:.68rem;letter-spacing:.05em}
.business-engine span{display:block;color:var(--earth);font-size:.74rem;font-weight:700;margin-top:3px}
.business-engine small{display:block;color:var(--muted);font-size:.68rem;line-height:1.5;margin-top:4px}


.loop-wrap{position:relative}
.loop-track{
  display:grid;grid-template-columns:repeat(10,minmax(132px,1fr));
  gap:28px;margin-top:36px;overflow-x:auto;padding:6px 3px 20px;
  scrollbar-width:thin;
}
.loop-card{
  position:relative;min-width:132px;padding:19px 15px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
}
.loop-card::after{
  content:"→";position:absolute;right:-23px;top:50%;transform:translateY(-50%);
  color:var(--earth);font-size:.9rem
}
.loop-card:last-child::after{content:"↺"}
.loop-card .n{display:block;color:var(--earth);font-size:1.15rem;font-weight:700}
.loop-card .en{
  display:block;margin-top:8px;color:var(--green);
  font-size:.72rem;font-weight:700;letter-spacing:.05em
}
.loop-card .jp2{display:block;margin-top:4px;color:var(--muted);font-size:.78rem}
.loop-close{
  display:flex;align-items:flex-start;
